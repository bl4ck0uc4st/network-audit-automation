name: Python (offline checks)

on:
  push:
  pull_request:

jobs:
  basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline audit
        run: |
          python3 tool.py offline-audit --all
          python3 tool.py render-report --all
